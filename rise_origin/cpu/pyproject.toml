[build-system]
requires = ["scikit-build-core>=0.12.2"]
build-backend = "scikit_build_core.build"

[project]
name = "rise-origin-core-cpu"
dynamic = ["version"]
description = "rise-origin CPU backend"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Muhan Li", email = "muhanli@beyond-infinity.top" }]
dependencies = []

[tool.scikit-build]
cmake.version = ">=3.22"
cmake.build-type = "Release"
cmake.source-dir = "../.."
wheel.packages = ["rise_origin_python_core"]
sdist.include = ["../../lib/**", "../../include/**", "../../cmake/**", "../../src/**", "../../CMakeLists.txt"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../VERSION"
regex = '(?P<value>.+)'

[tool.scikit-build.cmake.define]
# Portable SSE4.2-era baseline so the wheel runs on any x86-64-v2 CPU.
RISE_ORIGIN_CPU_ARCH = "x86-64-v2"
RISE_ORIGIN_BACKEND = "cpu"
BUILD_RISE_ORIGIN = "ON"
BUILD_RISE_ORIGIN_TEST = "OFF"

[tool.cibuildwheel]
build = "cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64"
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_28_x86_64"
before-all = """
dnf -y install dnf-plugins-core epel-release && \
dnf config-manager --set-enabled powertools && \
dnf -y install gcc-toolset-11 boost-devel hdf5-devel libxcrypt-devel && \
/opt/python/cp312-cp312/bin/pip install --prefix=/usr/local tbb==2023.0.0 tbb-devel==2023.0.0
"""
environment = { PATH = "/opt/rh/gcc-toolset-11/root/usr/bin:$PATH", LD_LIBRARY_PATH = "/usr/local/lib:$LD_LIBRARY_PATH", CC = "/opt/rh/gcc-toolset-11/root/usr/bin/gcc", CXX = "/opt/rh/gcc-toolset-11/root/usr/bin/g++" }
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"
