{% set version = load_file_regex(load_file='../VERSION', regex_pattern='^(.+)$', from_recipe_dir=True).group(1) %}

package:
  name: rise-origin
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  skip: true  # [not linux]
  run_exports:
    - {{ pin_subpackage('rise-origin', max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('c') }}      # gcc, version pinned in conda_build_config.yaml
    - {{ compiler('cxx') }}    # gxx, version pinned in conda_build_config.yaml
    - cmake >=3.22
    - ninja
    - cuda-version {{ cuda_version }}   # constrains cuda-nvcc to the variant's CUDA major
    - cuda-nvcc
    - sysroot_linux-64 2.28
  host:
    - cuda-version {{ cuda_version }}
    - cuda-cudart-dev
    - python
    - pip
    - scikit-build-core >=0.12.2
    - hdf5 1.14.3
    - libboost-devel 1.85.0
    - tbb-devel
    - zlib 1.3.1
    - libxcrypt
  run:
    - python
    - numpy >=1.24
    - {{ pin_compatible('cuda-version', max_pin='x') }}
    - cuda-cudart
    - hdf5 1.14.3
    - libboost 1.85.0
    - tbb
    - zlib 1.3.1
    - libxcrypt

test:
  imports:
    - rise_origin

about:
  home: https://github.com/phenoweave/rise-origin
  license: Apache-2.0
  summary: GPU-accelerated voxel simulator for rigid and soft body simulations
